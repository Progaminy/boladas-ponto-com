{% extends "base.html" %}
{% block title %}Entrar — Boladas-ponto-com{% endblock %}
{% block content %}

<div style="max-width: 480px; margin: 0 auto;">
  <h1 style="text-align: center;">Entrar na Conta</h1>
  <p class="subtitle" style="text-align: center;">Introduz o teu Email ou Número de Telefone para aceder.</p>

  {% if error %}<div class="error-box">{{ error }}</div>{% endif %}

  <!-- BOTAO GOOGLE SIGN-IN -->
  <div style="margin-bottom: 1.5rem; text-align: center;">
    <form method="get" action="/auth/google">
      <button type="submit" class="btn-secondary" style="width: 100%; padding: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 0.6rem; background: #FFFFFF; color: #111827; font-weight: 700; border-radius: 8px; border: 1px solid #D1D5DB; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        Entrar com o Google
      </button>
    </form>
    <div style="display: flex; align-items: center; margin: 1.2rem 0; color: #6B7280; font-size: 0.85rem;">
      <div style="flex: 1; border-bottom: 1px solid #374151;"></div>
      <span style="padding: 0 0.8rem;">ou com Email / Telefone</span>
      <div style="flex: 1; border-bottom: 1px solid #374151;"></div>
    </div>
  </div>

  <form method="post" action="/entrar">
    <div class="field">
      <label for="identifier">Email ou Número de Telefone *</label>
      <input type="text" id="identifier" name="identifier" required maxlength="200" placeholder="exemplo@dominio.co.mz ou +258 84 123 4567" />
    </div>
    <div class="field">
      <label for="password">Password *</label>
      <input type="password" id="password" name="password" required maxlength="200" />
    </div>
    <button type="submit" style="width: 100%; margin-top: 0.5rem;">Entrar</button>
  </form>

  <p class="muted" style="text-align: center; margin-top: 1.5rem;">Ainda não tens conta? <a href="/registar">Registar</a></p>
</div>
{% endblock %}

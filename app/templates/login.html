{% extends "base.html" %}
{% block title %}Entrar — Boladas-ponto-com{% endblock %}
{% block content %}

<div style="max-width: 480px; margin: 0 auto;">
  <h1 style="text-align: center;">Entrar na Conta</h1>
  <p class="subtitle" style="text-align: center;">Introduz o teu Email ou Número de Telefone para aceder.</p>

  {% if error %}<div class="error-box">{{ error }}</div>{% endif %}

  <form method="post" action="/entrar">
    <input type="hidden" name="next" value="{{ next_url }}" />
    <div class="field">
      <label for="identifier">Email ou Número de Telefone *</label>
      <input type="text" id="identifier" name="identifier" required maxlength="200" placeholder="exemplo@dominio.co.mz ou +258 84 123 4567" />
    </div>
    <div class="field">
      <label for="password">Password *</label>
      <input type="password" id="password" name="password" required maxlength="200" />
    </div>
    <button type="submit" style="width: 100%; margin-top: 0.5rem;">Entrar</button>
  </form>

  <p class="muted" style="text-align: center; margin-top: 1.5rem;">Ainda não tens conta? <a href="/registar">Registar</a></p>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Entrar — Boladas-ponto-com{% endblock %}
{% block content %}
<h1>Entrar</h1>

{% if error %}<div class="error-box">{{ error }}</div>{% endif %}

<form method="post" action="/entrar">
  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required maxlength="200" />
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required maxlength="200" />
  </div>
  <button type="submit">Entrar</button>
</form>
<p class="muted">Ainda não tens conta? <a href="/registar">Registar</a></p>
{% endblock %}

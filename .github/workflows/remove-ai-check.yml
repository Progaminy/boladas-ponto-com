name: Validate no AI

on:
  push:
    branches: [remover-ia-20260911]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove obsolete generative styles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/static/css/styles.css')
          text = path.read_text()
          text = re.sub(
              r'\n/\* --- verificação de proveniência ao vivo --- \*/.*?(?=\n/\* --- página de estado --- \*/)',
              '\n',
              text,
              flags=re.S,
          )
          text = re.sub(
              r'\n\.describe-ai \{.*?\.describe-status\.failed \{[^}]*\}\n',
              '\n',
              text,
              flags=re.S,
          )
          path.write_text(text)
          PY
          if ! git diff --quiet -- app/static/css/styles.css; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/static/css/styles.css
            git commit -m "Remove obsolete generative media styles"
            git push
          fi
      - name: Install
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q app
      - name: Reject remaining AI references
        shell: bash
        run: |
          if grep -RniE 'gemini|gmicloud|genblaze|intelig[eê]ncia artificial|AI_PROVIDER|VERTEX_EXPRESS|GMI_API|check_text_with_ai|check_media_with_ai|descricao/sugerir|categoria/sugerir|ai_status|routers[./]ai_edit|describe-ai' app README.md .env.example render.yaml requirements.txt scripts tests 2>/dev/null; then
            echo 'Found AI-related references that must be removed.'
            exit 1
          fi
      - name: Test
        run: pytest -q

services:
  - type: web
    name: boladas-ponto-com
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_POOLER_HOST
        value: aws-1-eu-west-1.pooler.supabase.com
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_BUCKET
        value: pensador-sem-fronteiras-media
      - key: B2_REGION
        value: us-east-005
      - key: B2_MEDIA_PREFIX
        sync: false
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: MAX_POSTS_PER_USER_PER_DAY
        value: "10"

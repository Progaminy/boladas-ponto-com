services:
  - type: web
    name: boladas-ponto-com
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    branch: main
    healthCheckPath: /health
    envVars:
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_BUCKET
        value: pensador-sem-fronteiras-media
      - key: B2_REGION
        value: us-east-005
      - key: AI_PROVIDER
        value: auto
      - key: VERTEX_EXPRESS_API_KEY
        sync: false
      - key: GEMINI_IMAGE_MODEL
        value: gemini-2.5-flash-image
      - key: GEMINI_CHAT_MODEL
        value: gemini-flash-latest
      - key: GMI_API_KEY
        sync: false
      - key: GMI_IMAGE_MODEL
        value: seedream-5.0-lite
      - key: GMI_CHAT_MODEL
        value: deepseek-ai/DeepSeek-V3-0324
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: MAX_POSTS_PER_USER_PER_DAY
        value: "10"

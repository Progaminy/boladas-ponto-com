services:
  - type: web
    name: boladas-ponto-com
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: B2_KEY_ID
        sync: false
      - key: B2_APP_KEY
        sync: false
      - key: B2_BUCKET
        value: pensador-sem-fronteiras-media
      - key: B2_REGION
        value: us-east-005
      - key: GMI_API_KEY
        sync: false
      - key: GMI_IMAGE_MODEL
        value: seedream-5.0-lite
      - key: GMI_CHAT_MODEL
        value: deepseek-ai/DeepSeek-V3-0324
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: MAX_POSTS_PER_USER_PER_DAY
        value: "10"
